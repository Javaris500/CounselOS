packages:
  - apps/*
  - packages/*

# Single source of truth for dependency versions across every workspace package.
# A package writes "zod": "catalog:" and pnpm resolves it here, so apps/api and
# apps/web can never end up on different majors of the same library.
#
# This is the dependency-level version of why packages/shared exists at all:
# things that must not drift get defined once.
catalog:
  # --- runtime: backend ---
  '@eslint/js': ^10.0.1
  '@faker-js/faker': ^10.1.0
  # Bridges the canonical Zod schemas in packages/shared into react-hook-form,
  # so one schema validates on both sides (06 Part 11 / the Form primitive).
  '@hookform/resolvers': ^5.9.0
  '@nestjs/bullmq': ^11.0.5

  # --- tooling ---
  '@nestjs/cli': ^11.0.24
  '@nestjs/common': ^11.2.1
  '@nestjs/config': ^4.0.4
  '@nestjs/core': ^11.2.1
  '@nestjs/event-emitter': ^3.0.1
  '@nestjs/platform-express': ^11.2.1
  '@nestjs/swagger': ^11.4.6
  '@nestjs/terminus': ^11.0.0
  '@nestjs/testing': ^11.2.1
  '@playwright/test': ^1.62.1
  '@sentry/nestjs': ^10.70.0
  '@sentry/nextjs': ^10.70.0
  # Pinned to minor per 05 §14J — major bumps can change auth behavior.
  '@supabase/supabase-js': ~2.112.3
  '@testcontainers/postgresql': ^11.14.0
  '@testcontainers/redis': ^11.14.0
  '@types/express': ^5.0.6
  '@types/jest': ^30.0.0

  # --- types ---
  # @types/node tracks the Node major in .nvmrc (24), not npm's latest tag,
  # which follows Node current (26) and would type against APIs we don't run.
  '@types/node': ^24.13.3
  '@types/react': ^19.2.18
  '@types/react-dom': ^19.2.4
  '@types/supertest': ^7.2.1
  bullmq: ^6.1.1
  concurrently: ^10.0.5
  # Reads the httpOnly refresh-token cookie. Setting cookies is native to
  # express; reading them is not.
  'cookie-parser': ^1.4.7
  '@types/cookie-parser': ^1.4.9
  drizzle-kit: ^0.31.10

  # --- runtime: data ---
  drizzle-orm: ^0.45.2
  eslint: ^10.8.1
  helmet: ^8.1.0
  ioredis: ^6.0.0

  # --- testing ---
  jest: ^30.4.2
  # Pinned to v5: v6 is ESM-only ("type": "module") and apps/api compiles to
  # CommonJS, which jest 30 + ts-jest cannot require() without transform surgery.
  # ~ pin for the same reason as @supabase/supabase-js — this verifies auth tokens.
  jose: ~5.10.0
  # Network-layer mocking. Intercepts below apiFetch so the real auth lifecycle
  # runs in tests — see 06 Part 14.
  msw: ^2.15.0
  nestjs-cls: ^6.2.1
  nestjs-zod: ^5.5.0

  # --- runtime: frontend ---
  next: ^16.3.1
  nock: ^14.0.10
  postgres: ^3.4.9
  prettier: ^3.9.6
  react: ^19.2.8
  react-dom: ^19.2.8
  react-hook-form: ^7.85.0
  reflect-metadata: ^0.2.2
  rxjs: ^7.8.2
  supertest: ^7.2.2
  swr: ^2.5.1
  testcontainers: ^11.14.0
  ts-jest: ^29.4.7
  tsx: ^4.23.12
  turbo: ^2.10.10
  typescript: 5.9.3
  typescript-eslint: ^8.67.0

  # --- shared by both apps ---
  zod: ^4.4.3
  zustand: ^5.0.8

# pnpm 10 blocks dependency postinstall scripts by default — a supply-chain
# precaution worth keeping. These are the ones we deliberately allow, each
# because it downloads or compiles a native binary it can't work without:
#   esbuild        — bundler binary behind tsx and drizzle-kit
#   unrs-resolver  — native module resolver used by eslint
# @scarf/scarf is deliberately absent: it's analytics, and nothing breaks
# without it. msw is deliberately absent too — it compiles nothing, and its
# worker script is committed at apps/web/public/mockServiceWorker.js rather
# than generated at install time, so a fresh clone needs no postinstall at all.
# Refresh it after an msw upgrade with `pnpm --filter @counselos/web msw:init`.
onlyBuiltDependencies:
  - esbuild
  - unrs-resolver
